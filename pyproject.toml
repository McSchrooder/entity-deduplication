[project]
name = "dedupe"
version = "0.1.0"
description = "Tiered entity resolution: hybrid retrieval, heuristic/cross-encoder/LLM/learned scoring, benchmarked on a production guest corpus"
requires-python = ">=3.11"
license = "LicenseRef-Selfieware"  # MIT plus a mandatory weird-selfie landing page, see LICENSE
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "unidecode>=1.3",
    "rapidfuzz>=3.9",
    "tqdm>=4.69.1",
    "numpy>=1.26",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.7"]
qdrant = ["qdrant-client>=1.9"]
vespa = ["pyvespa>=0.45"]
ml = [
    "torch>=2.3",
    "FlagEmbedding>=1.2.10",
    "scikit-learn>=1.4",
    "optuna>=4.0",
]
onnx = ["onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.1"]
llm = [
    "openai>=1.30",
    "instructor>=1.3",
]
dev = ["pytest>=8.2", "ruff>=0.4"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dedupe"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/dedupe/resolver/llm.py" = ["E501"]  # prompt text stays unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
